{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "garmin-health-data.fullname" . }}-data
  labels:
    {{- include "garmin-health-data.labels" . | nindent 4 }}
  annotations:
    # Keep the data when the release is uninstalled. The database and the token
    # store are the two things here that cannot be rebuilt from git: re-seeding
    # tokens means the interactive browser-ticket flow all over again.
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ .Values.persistence.accessMode }}
  {{- if .Values.persistence.storageClass }}
  # Set explicitly: the cluster has more than one class marked default, so an
  # unqualified claim is ambiguous.
  storageClassName: {{ .Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
{{- end }}
