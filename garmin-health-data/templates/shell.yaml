{{- if .Values.shell.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "garmin-health-data.fullname" . }}-shell
  labels:
    {{- include "garmin-health-data.labels" . | nindent 4 }}
    app.kubernetes.io/component: shell
spec:
  replicas: 1
  # The volume is ReadWriteOnce, so a rolling update would deadlock waiting for
  # the old pod to release it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "garmin-health-data.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: shell
  template:
    metadata:
      labels:
        {{- include "garmin-health-data.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: shell
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: shell
          image: "{{ .Values.shell.image.repository }}:{{ .Values.shell.image.tag }}"
          command: ["sh", "-c", "sleep infinity"]
          volumeMounts:
            - name: data
              mountPath: {{ .Values.home | quote }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "garmin-health-data.claimName" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
